<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamentos – Sistema de Orçamentos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
        nav { background: #1a1d2e; padding: 1rem 2rem; display: flex; gap: 1.5rem; align-items: center; border-bottom: 1px solid #2d3148; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 6px; transition: background 0.2s, color 0.2s; }
        nav a:hover { background: #2d3148; color: #e2e8f0; }
        nav a.active { background: #3b82f6; color: #fff; }
        nav .brand { color: #60a5fa; font-weight: 700; font-size: 1rem; margin-right: auto; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem; }
        h1 { font-size: 1.5rem; color: #60a5fa; margin-bottom: 1.5rem; }
        .flash { background: #1e3a2e; border: 1px solid #22c55e; color: #86efac; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .card { background: #1a1d2e; border: 1px solid #2d3148; border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
        .card h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.3rem; }
        input, select { width: 100%; padding: 0.6rem 0.8rem; background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; color: #e2e8f0; font-size: 0.95rem; margin-bottom: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #3b82f6; }
        select option { background: #1a1d2e; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
        .full { grid-column: 1 / -1; }
        .btn { padding: 0.6rem 1.4rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; font-size: 0.8rem; padding: 0.35rem 0.8rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead tr { border-bottom: 2px solid #2d3148; }
        th { text-align: left; padding: 0.6rem 0.8rem; color: #64748b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #1e2136; }
        tr:hover td { background: #1e2136; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-mg { background: #1e3a5f; color: #60a5fa; }
        .badge-sp { background: #3a1e2e; color: #f472b6; }
        .badge-rj { background: #1e3a2e; color: #34d399; }
        .alert-warn { background: #3a2e1e; border: 1px solid #f59e0b; color: #fbbf24; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; }
    </style>
</head>
<body>

<nav>
    <span class="brand">📋 Orçamentos</span>
    <a href="/usuarios">Usuários</a>
    <a href="/fornecedores">Fornecedores</a>
    <a href="/orcamentos" class="active">Orçamentos</a>
</nav>

<div class="container">
    <h1>Cadastro de Orçamentos</h1>

    <div th:if="${mensagem}" class="flash" th:text="${mensagem}"></div>

    <!-- Aviso se não houver usuários ou fornecedores cadastrados -->
    <div th:if="${#lists.isEmpty(usuarios) or #lists.isEmpty(fornecedores)}" class="alert-warn">
        ⚠️ Cadastre ao menos um <a href="/usuarios" style="color:#fbbf24">Usuário</a>
        e um <a href="/fornecedores" style="color:#fbbf24">Fornecedor</a> antes de criar um orçamento.
    </div>

    <div class="card">
        <h2>Novo Orçamento</h2>
        <form th:action="@{/orcamentos}" th:object="${orcamentoModel}" method="post">
            <div class="form-grid">
                <!-- Select de Usuário — envia usuarioId como RequestParam -->
                <div>
                    <label for="usuarioId">Usuário Responsável</label>
                    <select id="usuarioId" name="usuarioId" required>
                        <option value="">-- Selecione --</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.id}"
                                th:text="${u.nomeUsuario}">
                        </option>
                    </select>
                </div>

                <!-- Select de Fornecedor — envia fornecedorId como RequestParam -->
                <div>
                    <label for="fornecedorId">Fornecedor</label>
                    <select id="fornecedorId" name="fornecedorId" required>
                        <option value="">-- Selecione --</option>
                        <option th:each="f : ${fornecedores}"
                                th:value="${f.id}"
                                th:text="${f.nomeFornecedor}">
                        </option>
                    </select>
                </div>

                <!-- Valor do Orçamento -->
                <div>
                    <label for="valorOrcamento">Valor do Orçamento (R$)</label>
                    <input type="number" step="0.01" id="valorOrcamento"
                           th:field="*{valorOrcamento}" placeholder="Ex: 5000.00" required>
                </div>

                <!-- Estado ICMS -->
                <div>
                    <label for="icmsEstados">Estado (ICMS)</label>
                    <select id="icmsEstados" th:field="*{icmsEstados}" required>
                        <option value="">-- Selecione o Estado --</option>
                        <option th:each="estado : ${icmsEstados}"
                                th:value="${estado}"
                                th:text="${estado.name().replace('ICMS_', '')}">
                        </option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Calcular ICMS e Salvar</button>
        </form>
    </div>

    <div class="card">
        <h2>Orçamentos Cadastrados</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Usuário</th>
                <th>Fornecedor</th>
                <th>Valor</th>
                <th>Estado</th>
                <th>ICMS Calculado</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="orc : ${orcamentos}">
                <td th:text="${orc.id}"></td>
                <td th:text="${orc.usuario?.nomeUsuario ?: '-'}"></td>
                <td th:text="${orc.fornecedor?.nomeFornecedor ?: '-'}"></td>
                <td th:text="'R$ ' + ${#numbers.formatDecimal(orc.valorOrcamento, 1, 2)}"></td>
                <td>
                        <span th:text="${orc.icmsEstados?.name()?.replace('ICMS_', '')}"
                              th:classappend="${orc.icmsEstados?.name() == 'ICMS_MG' ? 'badge badge-mg' :
                                               orc.icmsEstados?.name() == 'ICMS_SP' ? 'badge badge-sp' : 'badge badge-rj'}">
                        </span>
                </td>
                <td th:text="'R$ ' + ${#numbers.formatDecimal(orc.valorICMS, 1, 2)}"></td>
                <td>
                    <form th:action="@{'/orcamentos/deletar/' + ${orc.id}}" method="post"
                          onsubmit="return confirm('Remover este orçamento?')">
                        <button type="submit" class="btn btn-danger">Remover</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(orcamentos)}">
                <td colspan="7" style="color:#64748b; text-align:center;">Nenhum orçamento cadastrado ainda.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
