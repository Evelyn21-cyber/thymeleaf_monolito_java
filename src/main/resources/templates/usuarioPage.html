<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários – Sistema de Orçamentos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

        nav {
            background: #1a1d2e;
            padding: 1rem 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            border-bottom: 1px solid #2d3148;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }
        nav a:hover { background: #2d3148; color: #e2e8f0; }
        nav a.active { background: #3b82f6; color: #fff; }
        nav .brand { color: #60a5fa; font-weight: 700; font-size: 1rem; margin-right: auto; }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }

        h1 { font-size: 1.5rem; color: #60a5fa; margin-bottom: 1.5rem; }

        .flash {
            background: #1e3a2e;
            border: 1px solid #22c55e;
            color: #86efac;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .card {
            background: #1a1d2e;
            border: 1px solid #2d3148;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .card h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }

        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.3rem; }
        input, select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #0f1117;
            border: 1px solid #2d3148;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: #3b82f6; }

        .btn {
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-danger  { background: #ef4444; color: #fff; font-size: 0.8rem; padding: 0.35rem 0.8rem; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead tr { border-bottom: 2px solid #2d3148; }
        th { text-align: left; padding: 0.6rem 0.8rem; color: #64748b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #1e2136; }
        tr:hover td { background: #1e2136; }
    </style>
</head>
<body>

<nav>
    <span class="brand">📋 Orçamentos</span>
    <a href="/usuarios" class="active">Usuários</a>
    <a href="/fornecedores">Fornecedores</a>
    <a href="/orcamentos">Orçamentos</a>
</nav>

<div class="container">
    <h1>Cadastro de Usuários</h1>

    <div th:if="${mensagem}" class="flash" th:text="${mensagem}"></div>

    <div class="card">
        <h2>Novo Usuário</h2>
        <form th:action="@{/usuarios}" th:object="${usuarioModel}" method="post">
            <label for="nomeUsuario">Nome do Usuário</label>
            <input type="text" id="nomeUsuario" th:field="*{nomeUsuario}" placeholder="Ex: João Silva" required>
            <button type="submit" class="btn btn-primary">Salvar Usuário</button>
        </form>
    </div>

    <div class="card">
        <h2>Usuários Cadastrados</h2>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Ação</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.nomeUsuario}"></td>
                <td>
                    <form th:action="@{'/usuarios/deletar/' + ${usuario.id}}" method="post"
                          onsubmit="return confirm('Remover este usuário?')">
                        <button type="submit" class="btn btn-danger">Remover</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="3" style="color:#64748b; text-align:center;">Nenhum usuário cadastrado ainda.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
